name: Windows pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run package and pipeline tests
        run: python -m pytest tests -q
      - name: Run frozen evaluator validation
        env:
          EVALUATOR_PATH: validation/evaluators/evaluator_v1_1.py
        run: python -m pytest validation/test_evaluator.py -q
